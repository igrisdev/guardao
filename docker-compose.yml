services:
  postgres:
    image: postgres:16
    container_name: guardao-postgres
    environment:
      POSTGRES_DB: guardao
      POSTGRES_USER: guardao
      POSTGRES_PASSWORD: guardao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardao -d guardao"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
